[package]
name = "pip-anywhere-host"
version = "0.3.0"
description = "PiP Anywhere native messaging host for Windows"
license = "MIT"
edition = "2021"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
